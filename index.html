    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>
/* Start-screen veil: paint the vibe colour before anything else renders, so
   the editor never flashes under the start screen. bench-splash.js lifts it
   (BenchSplash.lift) once the start screen is up or skipped; a timer lifts it
   regardless, so a script error can never leave the page blank. */
(function (def) {
  var V = { darkroom: '#0a0a0a', midwest: '#f5f2ed', brutalist: '#ffffff', retrowave: '#0f0518' };
  var v = def; try { var s = localStorage.getItem('todd-vibe'); if (s && V[s]) v = s; } catch (e) {}
  var st = document.createElement('style'); st.id = 'bench-veil-style';
  st.textContent = 'html.bench-veil{background:' + V[v] + '!important}html.bench-veil body{background:' + V[v] + '!important}html.bench-veil body>*:not(.bench-splash):not(.bench-help){visibility:hidden!important}';
  document.head.appendChild(st);
  document.documentElement.classList.add('bench-veil');
  setTimeout(function () { document.documentElement.classList.remove('bench-veil'); }, 4000);
})('darkroom');
</script>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
